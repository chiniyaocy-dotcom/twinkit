name: Gallery 状态

on:
  schedule:
    - cron: "17 1 * * 1"   # 每周一 01:17 UTC
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gallery-status
  cancel-in-progress: false

jobs:
  status:
    if: github.repository == 'chiniyaocy-dotcom/twinkit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 探测所有分身，统计目标进度
        run: node scripts/gallery-check.mjs --online
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: 提交 STATUS.md / status.json / history.csv
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery/STATUS.md gallery/status.json gallery/history.csv
          git diff --cached --quiet || git commit -m "gallery: 更新状态 $(date -u +%F)"
          git push
